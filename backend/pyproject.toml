[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-lens"
version = "0.1.0"
description = "Contract-first foundation for the Incident Lens investigation assistant"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<1",
  "pydantic>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "scikit-learn>=1.5,<2",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
# Kept optional so the API/request worker never needs a parquet reader or
# Spark/Java runtime.  CI can install `.[data,spark]` for offline jobs.
data = ["polars>=1,<2"]
spark = ["pyspark>=3.5,<4"]

[tool.setuptools.packages.find]
where = ["."]
