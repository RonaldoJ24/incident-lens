[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-lens"
version = "0.1.0"
description = "Contract-first foundation for the Incident Lens investigation assistant"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.30,<1"
]

[tool.setuptools.packages.find]
where = ["."]
