services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: incident_lens
      POSTGRES_USER: incident_lens
      POSTGRES_PASSWORD: incident_lens_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_lens -d incident_lens"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - incident-lens-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      INCIDENT_LENS_ENV: local
      INCIDENT_LENS_DATABASE_URL: postgresql://incident_lens:incident_lens_local@postgres:5432/incident_lens
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["sh", "-c", "python -m incident_lens.migrations && uvicorn incident_lens.api.app:app --host 0.0.0.0 --port 8000"]

volumes:
  incident-lens-postgres:
