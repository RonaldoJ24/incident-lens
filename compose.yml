services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incident_lens}
      POSTGRES_USER: ${POSTGRES_USER:-incident_lens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked .env file}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - incident-lens-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      INCIDENT_LENS_ENV: local
      INCIDENT_LENS_DATABASE_URL: postgresql://${POSTGRES_USER:-incident_lens}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-incident_lens}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["sh", "-c", "python -m incident_lens.migrations && uvicorn incident_lens.api.app:app --host 0.0.0.0 --port 8000"]

volumes:
  incident-lens-postgres:
