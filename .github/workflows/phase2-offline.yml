name: Phase 2 offline pipeline

on:
  workflow_dispatch:

jobs:
  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
      - name: Install offline extras
        run: uv sync --project backend --extra data --extra spark
      - name: Run unit and isolation checks
        run: PYTHONPATH=backend uv run --project backend python -m unittest discover -s backend/tests -v
      - name: Exercise Spark normalization on an authored temporary input
        run: |
          PYTHONPATH=backend uv run --project backend python - <<'PY'
          import tempfile
          from pathlib import Path
          from pyspark.sql import SparkSession
          from incident_lens.pipeline.normalization import normalize_case
          from incident_lens.pipeline.spark_normalize import run_spark_normalization

          spark = SparkSession.builder.master("local[2]").appName("incident-lens-ci").getOrCreate()
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              raw = root / "dev-re2ob-001"
              raw.mkdir()
              records = {
                  "logs": [{"time": 1700000000123456, "message": "same"}, {"time": 1700000000123456, "message": "same"}],
                  "metrics": [{"time": 1700000000123456789, "value": 1.0}],
                  "traces": [{"timestamp": "2023-11-14T22:13:20.123456789Z", "span": "a"}],
              }
              spark.createDataFrame([(row["time"], row["message"]) for row in records["logs"]], ["time", "message"]).write.parquet(str(raw / "logs.parquet"))
              spark.createDataFrame([(row["time"], row["value"]) for row in records["metrics"]], ["time", "value"]).write.parquet(str(raw / "metrics.parquet"))
              spark.createDataFrame([(row["timestamp"], row["span"]) for row in records["traces"]], ["timestamp", "span"]).write.parquet(str(raw / "traces.parquet"))
              portable = normalize_case("dev-re2ob-001", "development", "source-v1", "dataset-v1", records, strict=False)
              result = run_spark_normalization(raw, root / "derived", case_id="dev-re2ob-001", split="development", source_version="source-v1", dataset_revision="dataset-v1")
              assert result["manifest_hash"] == portable.manifest_hash
              assert result["signals"] == [item.as_dict() for item in portable.signals]

              bad = root / "dev-re2ob-002"
              bad.mkdir()
              spark.createDataFrame([("2024-01-01T00:00:00Z", "root_cause=do-not-index")], ["timestamp", "message"]).write.parquet(str(bad / "logs.parquet"))
              try:
                  run_spark_normalization(bad, root / "bad-derived", case_id="dev-re2ob-002", split="development", source_version="source-v1", dataset_revision="dataset-v1")
              except Exception as exc:
                  assert "leakage" in str(exc).lower()
              else:
                  raise AssertionError("Spark accepted leakage")
          spark.stop()
          PY
